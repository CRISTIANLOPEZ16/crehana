[project]
name = "task-manager"
version = "0.1.0"
description = "Task list and task management API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "black>=25,<27",
    "coverage[toml]>=7.10,<8",
    "flake8>=7,<8",
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/task_manager"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["task_manager"]

[tool.coverage.run]
branch = true
source = ["src/task_manager"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = false
